<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jujutsu Kaisen — Characters</title>
  <meta name="description" content="Explora todos los personajes de Jujutsu Kaisen con sus técnicas malditas, rango, afiliaciones y más." />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            cinzel: ['Cinzel', 'serif'],
            inter:  ['Inter', 'sans-serif'],
          },
          colors: {
            jjk: {
              dark:    '#050508',
              darker:  '#08080f',
              card:    '#0e0e1a',
              border:  '#1e1e35',
              purple:  '#7c3aed',
              indigo:  '#4f46e5',
              pink:    '#db2777',
              cyan:    '#06b6d4',
              gold:    '#f59e0b',
              muted:   '#6b7280',
              text:    '#e2e8f0',
              sub:     '#94a3b8',
            }
          },
          boxShadow: {
            card: '0 0 0 1px rgba(124,58,237,0.15), 0 8px 32px rgba(0,0,0,0.6)',
            glow: '0 0 20px rgba(124,58,237,0.4)',
            'glow-pink': '0 0 20px rgba(219,39,119,0.4)',
          },
          backgroundImage: {
            'hero-gradient': 'radial-gradient(ellipse 80% 60% at 50% -10%, rgba(124,58,237,0.25) 0%, transparent 60%), linear-gradient(180deg, #050508 0%, #08080f 100%)',
            'card-gradient': 'linear-gradient(145deg, #0e0e1a 0%, #12121f 100%)',
            'badge-purple': 'linear-gradient(135deg, #7c3aed, #4f46e5)',
            'badge-pink':   'linear-gradient(135deg, #db2777, #9333ea)',
            'badge-cyan':   'linear-gradient(135deg, #06b6d4, #3b82f6)',
            'badge-gold':   'linear-gradient(135deg, #f59e0b, #ef4444)',
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      background-color: #050508;
      font-family: 'Inter', sans-serif;
      color: #e2e8f0;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #08080f; }
    ::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 3px; }

    /* Hero animated background orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      animation: float 8s ease-in-out infinite;
    }
    .orb-1 { width: 500px; height: 500px; background: #7c3aed; top: -200px; left: -100px; animation-delay: 0s; }
    .orb-2 { width: 400px; height: 400px; background: #db2777; top: -100px; right: -100px; animation-delay: -3s; }
    .orb-3 { width: 300px; height: 300px; background: #06b6d4; top: 150px; left: 50%; animation-delay: -6s; }

    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50%       { transform: translateY(-30px) scale(1.05); }
    }

    /* Card hover effect */
    .char-card {
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s ease, border-color 0.35s ease;
    }
    .char-card:hover {
      transform: translateY(-8px) scale(1.01);
      box-shadow: 0 0 0 1px rgba(124,58,237,0.5), 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(124,58,237,0.2);
      border-color: rgba(124,58,237,0.5);
    }

    /* Image overlay shimmer */
    .img-shimmer {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0%   { opacity: 1; }
      50%  { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* Tag pill */
    .tag {
      display: inline-flex;
      align-items: center;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Grade badge colors */
    .grade-special { background: linear-gradient(135deg,#f59e0b,#ef4444); color:#fff; }
    .grade-1       { background: linear-gradient(135deg,#7c3aed,#4f46e5); color:#fff; }
    .grade-2       { background: linear-gradient(135deg,#06b6d4,#3b82f6); color:#fff; }
    .grade-3       { background: linear-gradient(135deg,#4b5563,#374151); color:#e5e7eb; }
    .grade-semi    { background: linear-gradient(135deg,#10b981,#059669); color:#fff; }
    .grade-default { background: rgba(30,30,53,0.8); color:#94a3b8; }

    /* Status badge */
    .status-alive { background:rgba(16,185,129,0.15); color:#6ee7b7; border:1px solid rgba(16,185,129,0.3); }
    .status-dead  { background:rgba(239,68,68,0.15);  color:#fca5a5; border:1px solid rgba(239,68,68,0.3); }
    .status-unknown { background:rgba(107,114,128,0.15); color:#9ca3af; border:1px solid rgba(107,114,128,0.3); }

    /* Search input focus glow */
    #search-input:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(124,58,237,0.6), 0 0 20px rgba(124,58,237,0.2);
    }

    /* Filter button active */
    .filter-btn.active {
      background: linear-gradient(135deg,#7c3aed,#4f46e5);
      color: #fff;
      border-color: transparent;
    }

    /* Modal backdrop */
    #modal-backdrop {
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* Modal slide-in */
    #modal-content {
      animation: slideUp 0.35s cubic-bezier(0.34,1.2,0.64,1);
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    /* Section title line */
    .section-line::after {
      content: '';
      display: block;
      width: 40px;
      height: 3px;
      background: linear-gradient(90deg,#7c3aed,#db2777);
      border-radius: 2px;
      margin-top: 6px;
    }

    /* Skeleton loader */
    .skeleton {
      background: linear-gradient(90deg, #0e0e1a 25%, #1a1a2e 50%, #0e0e1a 75%);
      background-size: 200% 100%;
      animation: skeleton-wave 1.4s infinite;
      border-radius: 8px;
    }
    @keyframes skeleton-wave {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Pagination */
    .page-btn {
      transition: all 0.2s ease;
    }
    .page-btn:hover:not(:disabled) {
      background: rgba(124,58,237,0.2);
      border-color: rgba(124,58,237,0.5);
    }
    .page-btn.active-page {
      background: linear-gradient(135deg,#7c3aed,#4f46e5);
      border-color: transparent;
      color: #fff;
    }
    .page-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
  </style>
</head>

<body class="min-h-screen bg-jjk-dark antialiased">

  <!-- ═══════════════════════════════════ HERO ═══════════════════════════════════ -->
  <header class="relative overflow-hidden pt-16 pb-12">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Top bar -->
    <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between mb-12">
      <span class="text-xs font-semibold tracking-widest text-jjk-purple uppercase opacity-70">呪術廻戦</span>
      <span class="text-xs text-jjk-muted">API: jujutsukaisenapi.site</span>
    </div>

    <!-- Title -->
    <div class="relative z-10 text-center px-4">
      <h1 class="font-cinzel text-5xl sm:text-7xl font-black tracking-tight mb-4 leading-none">
        <span class="text-white">JUJUTSU</span>
        <span class="block bg-gradient-to-r from-jjk-purple via-jjk-pink to-jjk-cyan bg-clip-text text-transparent">KAISEN</span>
      </h1>
      <p class="text-jjk-sub text-base sm:text-lg max-w-md mx-auto font-light">
        Enciclopedia de personajes · Técnicas malditas · Rangos
      </p>
    </div>

    <!-- Divider -->
    <div class="relative z-10 mt-10 max-w-7xl mx-auto px-4 sm:px-6">
      <div class="h-px bg-gradient-to-r from-transparent via-jjk-border to-transparent"></div>
    </div>
  </header>

  <!-- ═══════════════════════════════════ CONTROLS ═══════════════════════════════════ -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 mb-10">
    <div class="flex flex-col sm:flex-row gap-4 items-stretch sm:items-center">
      <!-- Search -->
      <div class="relative flex-1">
        <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-jjk-muted pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
        </svg>
        <input
          id="search-input"
          type="text"
          placeholder="Buscar personaje..."
          class="w-full bg-jjk-card border border-jjk-border rounded-xl py-3 pl-10 pr-4 text-sm text-jjk-text placeholder-jjk-muted transition-all duration-200"
        />
      </div>

      <!-- Gender filter -->
      <div class="flex gap-2">
        <button data-filter="all"    class="filter-btn active px-4 py-3 rounded-xl border border-jjk-border text-sm font-medium text-jjk-sub transition-all">Todos</button>
        <button data-filter="Male"   class="filter-btn px-4 py-3 rounded-xl border border-jjk-border text-sm font-medium text-jjk-sub transition-all">♂ Masc.</button>
        <button data-filter="Female" class="filter-btn px-4 py-3 rounded-xl border border-jjk-border text-sm font-medium text-jjk-sub transition-all">♀ Fem.</button>
      </div>

      <!-- Sort -->
      <select
        id="sort-select"
        class="bg-jjk-card border border-jjk-border rounded-xl py-3 px-4 text-sm text-jjk-text cursor-pointer focus:outline-none transition-all"
      >
        <option value="id">Orden original</option>
        <option value="name">Nombre A-Z</option>
        <option value="age">Edad</option>
      </select>
    </div>

    <!-- Stats bar -->
    <div class="mt-4 flex gap-4 text-xs text-jjk-muted">
      <span id="stats-total"></span>
      <span id="stats-shown"></span>
    </div>
  </section>

  <!-- ═══════════════════════════════════ GRID ═══════════════════════════════════ -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 pb-16">

    <!-- Skeleton / Error / Empty -->
    <div id="state-container" class="hidden">
      <p id="state-message" class="text-center text-jjk-muted py-20 text-lg"></p>
    </div>

    <!-- Cards grid -->
    <div
      id="characters-grid"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
    ></div>

    <!-- Pagination -->
    <div id="pagination" class="mt-12 flex justify-center items-center gap-2 flex-wrap"></div>

  </main>

  <!-- ═══════════════════════════════════ MODAL ═══════════════════════════════════ -->
  <div
    id="modal-backdrop"
    class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4"
    role="dialog"
    aria-modal="true"
  >
    <div
      id="modal-content"
      class="relative bg-jjk-card border border-jjk-border rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-[0_0_60px_rgba(124,58,237,0.3)]"
    ></div>
  </div>

  <!-- ═══════════════════════════════════ FOOTER ═══════════════════════════════════ -->
  <footer class="border-t border-jjk-border mt-0">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex flex-col sm:flex-row justify-between items-center gap-3 text-xs text-jjk-muted">
      <span class="font-cinzel text-jjk-purple tracking-wider">JUJUTSU KAISEN API</span>
      <span>Datos obtenidos de <a href="https://data.jujutsukaisenapi.site" class="text-jjk-purple hover:text-white transition-colors">jujutsukaisenapi.site</a></span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
